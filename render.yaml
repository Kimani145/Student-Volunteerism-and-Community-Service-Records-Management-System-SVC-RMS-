# Render blueprint for the SVC-RMS API (apps/api). The web app goes on Vercel.
# Root Directory: leave EMPTY (the repo root). pnpm workspace commands must run from the repo root.
# Runtime: Node (NOT Docker). Do not set a Dockerfile path.
# Database: Supabase (not defined here). DATABASE_URL is the Supabase SESSION POOLER url for the svc_app role.

services:
  - type: web
    name: svc-rms-api
    runtime: node
    region: frankfurt            # closest Render region to Nairobi; data is stored OUTSIDE Kenya (see SRS A-05)
    plan: starter                # free plan sleeps and has no disk; disks need a paid plan
    branch: main
    autoDeployTrigger: commit
    # NODE_ENV=production is also set during the BUILD, and pnpm then skips devDependencies
    # (prisma, typescript...). --prod=false installs them so `prisma generate` and `tsc` work.
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @svc-rms/shared exec tsc &&
      pnpm --filter @svc-rms/api exec prisma generate --schema prisma/schema.prisma &&
      pnpm --filter @svc-rms/api build
    startCommand: pnpm --filter @svc-rms/api start
    healthCheckPath: /api/v1/healthz
    # Uploads (records) and the certificate PDF cache are written to STORAGE_ROOT.
    # Without a disk they are LOST on every deploy/restart.
    disk:
      name: svc-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: LOG_LEVEL
        value: info
      # --- database: least-privilege svc_app role via the Supabase SESSION pooler (port 5432), NOT the postgres owner.
      #     Format: postgresql://svc_app.<project-ref>:<SVC_APP_PASSWORD>@<pooler-host>:5432/postgres?sslmode=require&connection_limit=5
      - key: DATABASE_URL
        sync: false
      # --- secrets: Render generates strong random values ---
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_PEPPER
        generateValue: true
      - key: QR_MASTER_SECRET
        generateValue: true
      # --- certificate signing key: `node apps/api/src/scripts/gen-cert-key.mjs`, paste both values ---
      - key: CERT_SIGNING_PRIVATE_KEY
        sync: false
      - key: CERT_SIGNING_KEY_ID
        sync: false
      # --- public URL of the Vercel site, no trailing slash (certificate QR codes and emails) ---
      - key: PUBLIC_WEB_ORIGIN
        sync: false
      # --- registration + email ---
      - key: ALLOWED_STUDENT_EMAIL_DOMAINS   # comma-separated REAL student email domain(s)
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      # --- storage and uploads ---
      - key: STORAGE_ROOT
        value: /var/data
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      # --- certificate wording (placeholders until DCOLAP supplies the real values) ---
      - key: ISSUER_NAME
        value: Directorate of Community Outreach, Linkages and Partnerships, Technical University of Kenya
      - key: SIGNATORY_1_NAME
        sync: false
      - key: SIGNATORY_1_TITLE
        sync: false
      - key: SIGNATORY_2_NAME
        sync: false
      - key: SIGNATORY_2_TITLE
        sync: false
